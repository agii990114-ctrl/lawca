[project]
name = "lawca"
version = "0.1.0"
description = "법무법인 사무원용 송무 AI 에이전트"
authors = [
    { name = "agii990114-ctrl", email = "agii990114@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "holidays>=0.105",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
