# 서식 정의. 항목마다 필수 여부, 기본값, 사건에서 가져올 값을 정한다.
# 문구는 대법원 공개 양식의 일반적인 구성을 참고해 만들었다. 공식 양식과 한 글자씩 대조하지 않았으므로
# 실제 제출 전에 전자소송 양식과 비교한다.
#
# 항목 속성
# - key: 템플릿에서 쓰는 이름
# - type: text | date | select | number | textarea
# - required: 비어 있으면 초안을 만들지 않고 묻는다
# - required_if: 다른 항목 값이 이것일 때만 필수 (예: { method = "새 주소로 송달" })
# - from_case: 사건에서 채울 값 (court, case_number, case_name, plaintiffs, defendants, judgment_date)
# - default: 기본값. "today"는 오늘 날짜
# - allow_later: 모르면 "나중에 입력"을 골라 빈칸으로 둘 수 있다
# - remember: 입력한 값을 사건에 저장해 다음 서식에서 다시 묻지 않는다
#
# 서식 속성: common = [...]으로 공통 항목 중 쓸 것만 고른다(비우면 전부). 준비서면은 신청인이 없어 고른다.

[[common]]
key = "court"
label = "법원"
type = "text"
required = true
from_case = "court"

[[common]]
key = "case_number"
label = "사건번호"
type = "text"
required = true
from_case = "case_number"

[[common]]
key = "case_name"
label = "사건명"
type = "text"
required = true
from_case = "case_name"

[[common]]
key = "plaintiffs"
label = "원고"
type = "text"
required = true
from_case = "plaintiffs"

[[common]]
key = "defendants"
label = "피고"
type = "text"
required = true
from_case = "defendants"

[[common]]
key = "applicant"
label = "신청인(지위와 이름)"
type = "text"
required = true
remember = true
help = "예: 원고 홍길동"

[[common]]
key = "agent"
label = "소송대리인"
type = "text"
required = false
remember = true
help = "예: 법무법인 ○○ 담당변호사 ○○○. 없으면 비워 둡니다."

[[common]]
key = "filed_on"
label = "신청일"
type = "date"
required = true
default = "today"


[[form]]
id = "certificate_of_finality"
name = "확정증명원 신청서"
template = "certificate_of_finality.docx"
aliases = ["확정증명원", "확정증명", "판결확정증명원"]

[[form.fields]]
key = "judgment_date"
label = "판결 선고일"
type = "date"
required = true
from_case = "judgment_date"
remember = true

[[form.fields]]
key = "finality_date"
label = "판결 확정일"
type = "date"
required = true
allow_later = true
remember = true
help = "모르면 '나중에 입력'을 고르세요. 초안에 빈칸으로 남깁니다."


[[form]]
id = "certificate_of_service"
name = "송달증명원 신청서"
template = "certificate_of_service.docx"
aliases = ["송달증명원", "송달증명"]

[[form.fields]]
key = "served_document"
label = "송달된 문서"
type = "select"
options = ["판결정본", "결정정본", "이행권고결정정본", "화해권고결정정본", "지급명령정본"]
required = true
default = "판결정본"

[[form.fields]]
key = "served_party"
label = "송달받은 당사자"
type = "text"
required = true
from_case = "defendants"
help = "예: 피고 김철수"

[[form.fields]]
key = "copies"
label = "신청 통수"
type = "number"
required = true
default = "1"


[[form]]
id = "address_correction"
name = "주소보정서"
template = "address_correction.docx"
aliases = ["주소보정서", "주소보정", "주소 보정"]

[[form.fields]]
key = "target_party"
label = "송달받을 당사자"
type = "text"
required = true
from_case = "defendants"

[[form.fields]]
key = "method"
label = "신청 내용"
type = "select"
options = ["새 주소로 송달", "종전 주소로 재송달", "특별송달(야간)", "특별송달(휴일)", "공시송달"]
required = true

[[form.fields]]
key = "new_address"
label = "새 주소"
type = "textarea"
required = false
required_if = { method = "새 주소로 송달" }
remember = true

[[form.fields]]
key = "attachments"
label = "첨부 서류"
type = "text"
required = false
default = "주민등록초본 1통"


[[form]]
id = "fact_inquiry"
name = "사실조회신청서"
template = "fact_inquiry.docx"
aliases = ["사실조회신청서", "사실조회신청", "사실조회"]

[[form.fields]]
key = "institution"
label = "조회할 기관"
type = "text"
required = true
help = "예: 에스케이텔레콤 주식회사"

[[form.fields]]
key = "institution_address"
label = "기관 주소"
type = "textarea"
required = true
allow_later = true
help = "모르면 '나중에 입력'을 고르세요. 초안에 빈칸으로 남깁니다."

[[form.fields]]
key = "purpose"
label = "증명하려는 사실"
type = "textarea"
required = true
help = "예: 피고가 2025. 3.경 사용한 휴대전화 번호의 명의자"

[[form.fields]]
key = "inquiry_items"
label = "조회할 사항"
type = "textarea"
required = true
help = "한 줄에 하나씩 적습니다. 예: 010-1234-5678 번호의 2025. 3. 1. 당시 가입자 성명과 주소"


[[form]]
id = "execution_clause"
name = "집행문부여 신청서"
template = "execution_clause.docx"
aliases = ["집행문부여신청서", "집행문부여 신청서", "집행문부여", "집행문 부여", "집행문"]

[[form.fields]]
key = "title_document"
label = "집행권원"
type = "select"
options = ["판결", "화해조서", "조정조서", "화해권고결정", "조정을 갈음하는 결정"]
required = true
default = "판결"
help = "지급명령·이행권고결정은 원칙적으로 집행문 없이 집행할 수 있습니다."

[[form.fields]]
key = "judgment_date"
label = "집행권원 선고일(성립일)"
type = "date"
required = true
from_case = "judgment_date"
remember = true

[[form.fields]]
key = "creditor"
label = "채권자"
type = "text"
required = true
from_case = "plaintiffs"
help = "집행할 권리가 있는 쪽. 피고가 이긴 소송비용 등이라면 피고를 적습니다."

[[form.fields]]
key = "debtor"
label = "채무자"
type = "text"
required = true
from_case = "defendants"

[[form.fields]]
key = "copies"
label = "신청 통수"
type = "number"
required = true
default = "1"


# 준비서면은 DOCX 틀에 값만 채우는 서식이 아니라, 변호사 메모와 자료실의 과거 서면으로 본문 초안을 쓴다(lawca.agent.brief_flow).
# 본문 초안은 변호사만 받는다. 사무원은 본문이 빈 틀만 받는다.
[[form]]
id = "brief"
name = "준비서면"
template = "brief.docx"
aliases = ["준비서면", "준비 서면", "서면"]
common = ["court", "case_number", "case_name", "plaintiffs", "defendants", "agent", "filed_on"]

[[form.fields]]
key = "our_side"
label = "우리 측"
type = "select"
options = ["원고", "피고"]
required = true
remember = true

[[form.fields]]
key = "title"
label = "서면 제목"
type = "text"
required = true
default = "준비서면"
help = "예: 원고 제2준비서면"

[[form.fields]]
key = "notes"
label = "변호사 메모(우리 측 주장)"
type = "textarea"
required = true
help = "한 줄에 한 가지. 예: \"증여 아님: 이체 때 통장 표시를 '대여금'으로 적음(갑1)\". 자료실의 비슷한 과거 문단을 찾아 이 메모를 서면 문장으로 풀어 씁니다. 사무원은 비워 둬도 됩니다(본문은 변호사가 받습니다)."
